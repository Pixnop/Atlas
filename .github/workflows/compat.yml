name: Version Compatibility Sweep

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space or comma separated VS versions to sweep (overrides the default matrix)"
        required: false
        type: string
  schedule:
    - cron: "0 6 * * 1"
  # workflow_dispatch and schedule only work once this file reaches the default
  # branch, so also sweep when the workflow definition itself changes.
  push:
    branches: [main, "feat/**"]
    paths:
      - ".github/workflows/compat.yml"
      - ".github/actions/setup-vintage-story/**"

# One run per event kind and ref. A manual dispatch must not queue behind the weekly sweep
# (20+ minutes), hence github.event_name in the group. Nothing here is ever cancelled: this
# workflow has no pull_request trigger, and every run it does have is a result worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    name: Compute sweep matrix
    runs-on: ubuntu-latest
    # Least privilege, declared per job as the scanner asks: nothing here writes to the
    # repository; the job reads the checkout and the cache and uploads artifacts.
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - name: Compute matrix
        id: compute
        # inputs.versions goes through env rather than being interpolated into
        # the script, so a crafted dispatch input cannot inject shell commands.
        env:
          VERSIONS_INPUT: ${{ inputs.versions }}
        run: |
          set -e
          INPUT="$VERSIONS_INPUT"
          if [ -n "$INPUT" ]; then
            JSON=$(echo "$INPUT" | tr ',' ' ' | tr -s ' ' '\n' | grep -v '^$' | jq -R . | jq -sc .)
          else
            JSON='["1.18.15","1.19.8","1.20.12","1.21.7","1.22.0","1.22.1","1.22.2","1.22.3","1.22.4","1.22.5","1.22.6","1.22.7"]'
          fi
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: $JSON"

  sweep:
    name: Sweep VS ${{ matrix.vs-version }}
    needs: prepare
    runs-on: ubuntu-latest
    # Least privilege, declared per job as the scanner asks: nothing here writes to the
    # repository; the job reads the checkout and the cache and uploads artifacts.
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vs-version: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Vintage Story server
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ matrix.vs-version }}

      - name: Build
        id: build
        continue-on-error: true
        run: dotnet build Atlas.slnx -c Release

      - name: E2E tests - Atlas.Engine.Tests
        id: e2e-engine
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          dotnet test tests/Atlas.Engine.Tests \
            -c Release \
            --filter "Category=E2E" \
            --logger "trx;LogFileName=e2e-engine-tests.trx" \
            --results-directory TestResults

      - name: E2E tests - Sample.Scenarios
        id: e2e-sample
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          dotnet test samples/Sample.Scenarios \
            -c Release \
            --filter "Category=E2E" \
            --logger "trx;LogFileName=e2e-sample-scenarios.trx" \
            --results-directory TestResults

      - name: Verdict
        id: verdict
        if: always()
        run: |
          set -e
          VERSION="${{ matrix.vs-version }}"
          BUILD="${{ steps.build.outcome }}"
          ENGINE="${{ steps.e2e-engine.outcome }}"
          SAMPLE="${{ steps.e2e-sample.outcome }}"

          if [ "$BUILD" != "success" ]; then
            VERDICT="incompatible (API)"
            NOTE="build failed against this version's API"
          elif [ "$ENGINE" = "success" ] && [ "$SAMPLE" = "success" ]; then
            VERDICT="compatible"
            NOTE="build and E2E suites passed"
          else
            VERDICT="partial"
            FAILED=""
            if [ "$ENGINE" != "success" ]; then FAILED="Atlas.Engine.Tests"; fi
            if [ "$SAMPLE" != "success" ]; then
              if [ -n "$FAILED" ]; then FAILED="$FAILED, Sample.Scenarios"; else FAILED="Sample.Scenarios"; fi
            fi
            NOTE="build succeeded, failed: $FAILED"
          fi

          echo "${VERSION}|${VERDICT}|${NOTE}" > "compat-${VERSION}.txt"
          cat "compat-${VERSION}.txt"

          {
            echo "### VS ${VERSION}: ${VERDICT}"
            echo ""
            echo "- build: ${BUILD}"
            echo "- Atlas.Engine.Tests: ${ENGINE}"
            echo "- Sample.Scenarios: ${SAMPLE}"
            echo "- note: ${NOTE}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verdict artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.vs-version }}
          path: compat-${{ matrix.vs-version }}.txt
          if-no-files-found: error

  aggregate:
    name: Aggregate results
    needs: [prepare, sweep]
    if: always()
    runs-on: ubuntu-latest
    # Least privilege, declared per job as the scanner asks: nothing here writes to the
    # repository; the job reads the checkout and the cache and uploads artifacts.
    permissions:
      contents: read
    steps:
      - name: Download all verdict artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: compat-*
          path: verdicts
          merge-multiple: true

      # The sweep itself is deliberately non-blocking per version: 1.18.x and 1.19.8 are in the
      # matrix to record that they do NOT work, so a red step there is the expected answer. The
      # supported range is different. Since ci.yml stopped running 1.22.0 to 1.22.3 on every
      # push, this sweep is the only thing left watching them, and a sweep that can only ever
      # be green is not watching anything. So: anything at or above the floor (1.21.7) that
      # comes back other than "compatible" fails this job. Widen the floor when the README's
      # supported range moves.
      - name: Render consolidated summary
        env:
          SUPPORTED_FLOOR: "1.21.7"
          SWEPT_VERSIONS: ${{ needs.prepare.outputs.matrix }}
        run: |
          set -e
          # A missing verdict is not a pass. Count what the matrix asked for and compare, so a
          # sweep leg that died before writing its file cannot read as an empty regression list.
          EXPECTED=$(printf '%s' "$SWEPT_VERSIONS" | jq 'length')
          {
            echo "## Version compatibility sweep results"
            echo ""
            echo "| Version | Status | Notes |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          REGRESSED=""
          SEEN=0
          for f in verdicts/compat-*.txt; do
            [ -f "$f" ] || continue
            SEEN=$((SEEN + 1))
            IFS='|' read -r VERSION STATUS NOTE < "$f"
            echo "| $VERSION | $STATUS | $NOTE |" >> "$GITHUB_STEP_SUMMARY"

            # Supported means "at or above the floor": sort -V puts the floor first only when
            # the version is greater than or equal to it.
            LOWEST=$(printf '%s\n%s\n' "$VERSION" "$SUPPORTED_FLOOR" | sort -V | head -1)
            if [ "$LOWEST" = "$SUPPORTED_FLOOR" ] && [ "$STATUS" != "compatible" ]; then
              REGRESSED="$REGRESSED $VERSION"
            fi
          done

          if [ "$SEEN" -ne "$EXPECTED" ]; then
            {
              echo ""
              echo "Read $SEEN verdicts, expected $EXPECTED: a sweep leg produced none."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Read $SEEN verdicts, expected $EXPECTED: a sweep leg produced none." >&2
            exit 1
          fi

          if [ -n "$REGRESSED" ]; then
            {
              echo ""
              echo "Supported versions (>= $SUPPORTED_FLOOR) not compatible:$REGRESSED"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Supported versions (>= $SUPPORTED_FLOOR) not compatible:$REGRESSED" >&2
            exit 1
          fi
