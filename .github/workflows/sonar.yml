name: sonar

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege: nothing here writes to the repository. Jobs read the checkout, cache and
# upload artifacts, none of which needs more than this.
permissions:
  contents: read

# One run per branch and workflow. Cancelling in flight is limited to pull requests so that
# pushes to main keep a result per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Opt into the Node.js 24 action runtime ahead of the June 2026 forced switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VS_VERSION: "1.22.2"

jobs:
  sonar:
    name: SonarCloud analysis
    # Two cases where SONAR_TOKEN is not there to be had, and the scanner cannot authenticate
    # without it. Both are skipped here and picked up by the post-merge push run on main.
    #  - Fork PRs run without repository secrets.
    #  - Dependabot PRs get the dependabot secret store, not the repository one, so the token
    #    is empty even though the branch lives in this repository and clears the fork check.
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Raised from 40 as the 0.10.0 suite growth (atlas diff, tick and staging tests, the
    # cross-install work) pushed the coverage-instrumented E2E run past the 40 minute budget.
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Vintage Story server
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ env.VS_VERSION }}

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-cache-${{ runner.os }}

      - name: Cache dotnet-sonarscanner tool
        id: cache-sonarscanner
        uses: actions/cache@v6
        with:
          path: ~/.dotnet/tools
          key: sonarscanner-${{ runner.os }}

      - name: Install dotnet-sonarscanner
        if: steps.cache-sonarscanner.outputs.cache-hit != 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Coverage combines the pure suite with both E2E suites: the engine and
      # the game adapter only execute under E2E (they boot real Vintage Story
      # servers), so pure tests alone leave most of src/Atlas unexercised.
      # The extra E2E cost in this job is the price of a meaningful number.
      #
      # This job is now the slowest thing a pull request waits on: 17 min 40 s to 21 min 24 s
      # over the last five runs on main, against the roughly 9 min the sharded ci.yml lane
      # takes. It is deliberately left alone. The obvious fix is to reuse ci.yml's three shard
      # filters as three coverage jobs uploading their opencover reports, with the scanner
      # running begin, build, pure tests and end in a fourth job that downloads them. That
      # would halve the wall clock, but it hangs on the scanner resolving coverage produced by
      # a different job's build, and when that resolution fails it does not fail the job: it
      # quietly reports less coverage and moves the quality gate. Not a change to make without
      # a run to look at, so it stays here as the next step rather than as a guess.
      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet-sonarscanner begin
          /k:"Pixnop_Atlas"
          /o:"leon-fievet-pixnop"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.coverage.exclusions="samples/**,tests/**"
          /d:sonar.exclusions="docs/**"

      - name: Build
        run: dotnet build Atlas.slnx -c Release

      - name: Pure tests with coverage
        run: |
          dotnet test tests/Atlas.Pure.Tests \
            -c Release \
            --no-build \
            --filter "Category!=E2E" \
            --collect:"XPlat Code Coverage;Format=opencover"

      - name: E2E tests with coverage - Atlas.Engine.Tests
        run: |
          dotnet test tests/Atlas.Engine.Tests \
            -c Release \
            --no-build \
            --filter "Category=E2E" \
            --collect:"XPlat Code Coverage;Format=opencover"

      - name: E2E tests with coverage - Sample.Scenarios
        run: |
          dotnet test samples/Sample.Scenarios \
            -c Release \
            --no-build \
            --filter "Category=E2E" \
            --collect:"XPlat Code Coverage;Format=opencover"

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
