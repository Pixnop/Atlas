name: ci

on:
  push:
    # main only: a feat/** push used to run the whole matrix TWICE per commit (its own push
    # event plus the pull_request event), doubling E2E compute for zero extra information.
    branches: [main]
  pull_request:
    branches: [main, "feat/**"]

# Least privilege: nothing here writes to the repository. Jobs read the checkout, cache and
# upload artifacts, none of which needs more than this.
permissions:
  contents: read

# One run per branch and workflow. Cancelling in flight is limited to pull requests so that
# pushes to main keep a result per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VS_VERSION: "1.22.2"

jobs:
  build-and-pure-tests:
    name: Build & pure tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Vintage Story server
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ env.VS_VERSION }}

      # The engine contract theory (tests/Atlas.Pure.Tests/Bootstrap/EngineContractTests.cs) runs
      # one row per install, and until now CI gave it exactly one: the job's own VINTAGE_STORY.
      # A shape that drifted on the floor or on the latest stable therefore only showed up in the
      # E2E matrix, which boots a server per version and takes minutes. These two installs are the
      # same versions that matrix covers, so the pure job now catches that drift in milliseconds
      # from a single build. export-env: false keeps VINTAGE_STORY pointing at the job's own
      # install, which is what the suite compiles against; each install gets its own directory and
      # cache suffix, as the cross-install lane does, because the cache entry is keyed by both.
      - name: Setup floor Vintage Story server for the contract theory
        id: vs-compat-floor
        uses: ./.github/actions/setup-vintage-story
        with:
          version: "1.21.7"
          dir: vs-compat-floor
          cache-key-suffix: -compat-floor
          export-env: "false"

      - name: Setup latest Vintage Story server for the contract theory
        id: vs-compat-latest
        uses: ./.github/actions/setup-vintage-story
        with:
          version: "1.22.7"
          dir: vs-compat-latest
          cache-key-suffix: -compat-latest
          export-env: "false"

      - name: Build
        run: dotnet build Atlas.slnx -c Release

      - name: Pure tests
        env:
          # Path-separator separated, Linux runner, so ":". The theory adds the implicit
          # VINTAGE_STORY row on top of these two, which makes three.
          ATLAS_COMPAT_INSTALLS: ${{ steps.vs-compat-floor.outputs.path }}:${{ steps.vs-compat-latest.outputs.path }}
        run: |
          dotnet test tests/Atlas.Pure.Tests \
            -c Release \
            --filter "Category!=E2E" \
            --logger "trx;LogFileName=pure-tests.trx" \
            --results-directory TestResults

      - name: Upload pure test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pure-tests-trx
          path: TestResults/pure-tests.trx

  e2e:
    name: E2E scenarios (VS ${{ matrix.vs-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Was 30 for the whole suite; a shard is a third of it. The worst shard measured below is
    # 5.6 min of tests plus about 2 min of setup and build, but that measurement predates the
    # collector every leg now carries, so read it as a floor and not as the budget. The bound
    # the repository already has for the instrumented cost: sonar.yml ran a Release build, the
    # 697 pure tests and the WHOLE engine E2E suite plus the samples under this same collector
    # in 17 min 40 s to 21 min 24 s end to end, so the instrumented suite fits inside that and
    # a shard is a third of it. Replace the figure with the instrumented shard time measured on
    # the first run of this workflow, and raise this budget if a shard lands near 15.
    timeout-minutes: 15
    needs: build-and-pure-tests
    strategy:
      # One leg failing on a specific game version or shard should not hide the others' results.
      fail-fast: false
      matrix:
        # 1.21.7 is the supported-floor lane (one per supported line below latest, per the
        # pre-1.22 compat spec): it both runs the E2E suites through the EngineCompat shim and
        # enforces the source rule (no 1.22-only symbols outside the shim) by building the whole
        # graph against the 1.21 dlls on every push. The other lane is the latest stable.
        # 1.18.x through 1.22.6 all stay in compat.yml's weekly sweep, which already lists
        # 1.22.0 to 1.22.3 (compat.yml, the default matrix in the "Compute sweep matrix" step),
        # so dropping them here costs a week of latency on a regression specific to those four
        # builds, not coverage. That sweep now fails the run when a version at or above the
        # floor comes back not-compatible, so the loss of the per-push lane does not turn into
        # a green-looking summary nobody reads.
        vs-version: ["1.21.7", "1.22.7"]

        # Whole-class shards, one process each. Splitting a class is not an option: the suite
        # runs sequentially in one process by design (tests/Atlas.Engine.Tests/AssemblyInfo.cs
        # disables parallelization) because a class owns a live server, and one live host per
        # process is the rule. A shard is a separate job, so that rule still holds inside each.
        #
        # Composition comes from measured per-class durations, not guesses: the
        # e2e-tests-trx-1.22.7 artifact of run 34031675456 (merge of #116 on main) times the
        # suite at 998.8 s over 123 tests in 40 classes, and the whole leg at 19 min 04 s.
        # Bin-packed longest-first, the three shards come to 327.8 s (A), 334.7 s (B) and
        # 336.3 s (C). Adding the leg's fixed 2 min of checkout, setup, restore and build, a
        # shard is about 7.6 to 7.9 min on 1.22.7 and about a fifth less on 1.21.7, so the pull
        # request verdict lands near 9 min instead of 19, and the lane costs about 45
        # runner-minutes instead of 111.
        #
        # A and B name their classes; C is the complement, so the three filters partition the
        # suite by construction and a class added later lands in C rather than in no shard at
        # all. Verified with --list-tests: 29 + 28 + 66 = 123 tests, 5 + 7 + 28 = 40 classes,
        # no overlap. Rebalance by moving names between A and B; the union stays whole.
        #
        # Class order inside the assembly is already random per run (xunit v2), so no shard
        # composition can be more or less order-safe than what CI runs today. Separate
        # processes only remove interference: the 0.12.1 superseded-host flake needed
        # NestedRunnerTests and ScratchSweepTests in one process, and they are now in two.
        shard: [A, B, C]
        include:
          - shard: A
            filter: "Category=E2E&(FullyQualifiedName~Atlas.Engine.Tests.TestPlayerTests.|FullyQualifiedName~Atlas.Engine.Tests.IsolationObservabilityTests.|FullyQualifiedName~Atlas.Engine.Tests.KickedPlayerTests.|FullyQualifiedName~Atlas.Engine.Tests.WorldRollbackTests.|FullyQualifiedName~Atlas.Engine.Tests.WorldSaveTests.)"
          - shard: B
            filter: "Category=E2E&(FullyQualifiedName~Atlas.Engine.Tests.ClientObservationTests.|FullyQualifiedName~Atlas.Engine.Tests.ParallelModeTests.|FullyQualifiedName~Atlas.Engine.Tests.TeardownDiagnosticsTests.|FullyQualifiedName~Atlas.Engine.Tests.RollbackHookTests.|FullyQualifiedName~Atlas.Engine.Tests.WorkerModeTests.|FullyQualifiedName~Atlas.Engine.Tests.NestedRunnerTests.|FullyQualifiedName~Atlas.Engine.Tests.WorldSessionTests.)"
          - shard: C
            filter: "Category=E2E&FullyQualifiedName!~Atlas.Engine.Tests.TestPlayerTests.&FullyQualifiedName!~Atlas.Engine.Tests.IsolationObservabilityTests.&FullyQualifiedName!~Atlas.Engine.Tests.KickedPlayerTests.&FullyQualifiedName!~Atlas.Engine.Tests.WorldRollbackTests.&FullyQualifiedName!~Atlas.Engine.Tests.WorldSaveTests.&FullyQualifiedName!~Atlas.Engine.Tests.ClientObservationTests.&FullyQualifiedName!~Atlas.Engine.Tests.ParallelModeTests.&FullyQualifiedName!~Atlas.Engine.Tests.TeardownDiagnosticsTests.&FullyQualifiedName!~Atlas.Engine.Tests.RollbackHookTests.&FullyQualifiedName!~Atlas.Engine.Tests.WorkerModeTests.&FullyQualifiedName!~Atlas.Engine.Tests.NestedRunnerTests.&FullyQualifiedName!~Atlas.Engine.Tests.WorldSessionTests."

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Vintage Story server
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ matrix.vs-version }}

      # --collect is what feeds the sonar-report job below. Every leg carries it, not just the
      # latest-stable one: the collector's cost is the same on both, the union of six reports
      # covers at least what three would, and a version-conditional collect would have put a
      # game version string in a second place. The engine and the game adapter only execute
      # here, so without these reports the analysis sees the pure suite alone, which locally
      # covers 55.11 percent of src (one run of the 697 pure tests under the same collector).
      - name: E2E tests - Atlas.Engine.Tests (shard ${{ matrix.shard }})
        env:
          E2E_FILTER: ${{ matrix.filter }}
        run: |
          dotnet test tests/Atlas.Engine.Tests \
            -c Release \
            --filter "$E2E_FILTER" \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --logger "trx;LogFileName=e2e-engine-tests.trx" \
            --results-directory TestResults

      # Ten tests, 1.4 s in the same measured run: a per-version concern, not a per-shard one,
      # so it rides along with shard A instead of paying its own job or running three times.
      - name: E2E tests - Sample.Scenarios
        if: matrix.shard == 'A'
        run: |
          dotnet test samples/Sample.Scenarios \
            -c Release \
            --filter "Category=E2E" \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --logger "trx;LogFileName=e2e-sample-scenarios.trx" \
            --results-directory TestResults

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-tests-trx-${{ matrix.vs-version }}-${{ matrix.shard }}
          path: TestResults/*.trx

      # The collector writes one report per test run under its own GUID directory, so shard A
      # uploads two (engine and samples) and the others one. One level of glob, not two: with a
      # logger in the same run the collector also leaves a second copy of each report under
      # TestResults/_<machine>_<stamp>/In/<machine>/, and shipping both would have the scanner
      # import every report twice. Verified locally by running the pure suite with both flags.
      #
      # Not if: always(): a leg that went red skips sonar-report through needs anyway, and a
      # partial report there would be the exact thing that lowers coverage without saying so.
      # if-no-files-found: error so a collector that wrote nothing fails here, where the reason
      # is on screen, rather than as a coverage drop three jobs later.
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-opencover-${{ matrix.vs-version }}-${{ matrix.shard }}
          path: TestResults/*/coverage.opencover.xml
          if-no-files-found: error
          retention-days: 1

      # The scratch sweep (issue #83) keeps a red class's scratch directory for its
      # server-main.log; on a runner that evidence dies with the job unless uploaded.
      - name: Upload kept scratch server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-scratch-logs-${{ matrix.vs-version }}-${{ matrix.shard }}
          path: /tmp/atlas/*/Logs/server-main.log
          if-no-files-found: ignore

  # The prebuilt path (issue #49): build the samples ONCE against the primary install, then run
  # them unmodified (--no-build) on the floor install, again on the floor (idempotence: nothing
  # left to stage), and BACK on the primary (re-staging in the other direction), all from the one
  # build. This is what the engine-assembly auto-staging preflight exists for (differential CI at
  # constant build: StratumParity measured the per-install rebuild doubling their CI time), and
  # it is the lane the README's compatibility table used to caveat as designed-for-but-
  # unverified. Samples only: the E2E matrix above already covers the full suites per version;
  # this lane proves the NO-REBUILD crossing, and the cmp steps pin down that staging (not a
  # rebuild) put the target install's bytes in the output. The build deliberately targets the
  # NEWEST version: a floor-built output carries the floor's older game Newtonsoft build, which
  # the newer engine cannot run (it binds members the newer build added, and the test host pins
  # the output's copy at process start), so that direction fail-fasts by design and is not a
  # lane; see the README's multi-install section.
  prebuilt-cross-install:
    name: Prebuilt cross-install (1.22.3 -> 1.21.7 -> 1.22.3, one build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-pure-tests
    env:
      VS_PRIMARY: "1.22.3"
      VS_FLOOR: "1.21.7"

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Two installs side by side: each gets its own directory and cache entry, and each step
      # below picks the one it means through the step output. export-env: false keeps either
      # call from leaving a job-wide VINTAGE_STORY behind, which a later step could pick up by
      # accident and pass this lane against the wrong install.
      - name: Setup primary Vintage Story server
        id: vs-primary
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ env.VS_PRIMARY }}
          dir: vs-primary
          cache-key-suffix: -cross-primary
          export-env: "false"

      - name: Setup floor Vintage Story server
        id: vs-floor
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ env.VS_FLOOR }}
          dir: vs-floor
          cache-key-suffix: -cross-floor
          export-env: "false"

      - name: Build samples once, against the primary install
        env:
          VINTAGE_STORY: ${{ steps.vs-primary.outputs.path }}
        run: dotnet build samples/Sample.Scenarios -c Release

      - name: Run the prebuilt samples on the floor install, no rebuild
        env:
          VINTAGE_STORY: ${{ steps.vs-floor.outputs.path }}
        run: |
          dotnet test samples/Sample.Scenarios \
            -c Release \
            --no-build \
            --filter "Category=E2E" \
            --logger "trx;LogFileName=cross-primary-to-floor.trx" \
            --results-directory TestResults

      - name: Assert staging rewrote the output copy to the floor install's bytes
        env:
          VS_FLOOR_DIR: ${{ steps.vs-floor.outputs.path }}
        run: cmp samples/Sample.Scenarios/bin/Release/net10.0/VintagestoryAPI.dll "$VS_FLOOR_DIR/VintagestoryAPI.dll"

      - name: Run again on the floor install (idempotence, nothing left to stage)
        env:
          VINTAGE_STORY: ${{ steps.vs-floor.outputs.path }}
        run: |
          dotnet test samples/Sample.Scenarios \
            -c Release \
            --no-build \
            --filter "Category=E2E" \
            --logger "trx;LogFileName=cross-floor-idempotent.trx" \
            --results-directory TestResults

      - name: Run back on the primary install, still no rebuild
        env:
          VINTAGE_STORY: ${{ steps.vs-primary.outputs.path }}
        run: |
          dotnet test samples/Sample.Scenarios \
            -c Release \
            --no-build \
            --filter "Category=E2E" \
            --logger "trx;LogFileName=cross-back-to-primary.trx" \
            --results-directory TestResults

      - name: Assert staging rewrote the output copy back to the primary install's bytes
        env:
          VS_PRIMARY_DIR: ${{ steps.vs-primary.outputs.path }}
        run: cmp samples/Sample.Scenarios/bin/Release/net10.0/VintagestoryAPI.dll "$VS_PRIMARY_DIR/VintagestoryAPI.dll"

      - name: Upload cross-install test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-cross-install-trx
          path: TestResults/*.trx

  # SonarCloud used to live in its own workflow, running the pure suite plus the WHOLE engine
  # E2E suite plus the samples under the collector on one game version: 17 min 40 s to 21 min
  # 24 s over the last five runs on main, against the roughly 8.5 min this workflow takes. It
  # was the last check every pull request waited on, and it paid a second time for E2E work the
  # shards above were already doing.
  #
  # It is now two jobs here, and the coverage comes from the shards.
  #
  #   sonar-analysis  begin, build, pure suite under the collector. Needs nothing, so it starts
  #                   with the rest of the run and finishes while the shards are still going.
  #                   Its whole cost is off the critical path.
  #   sonar-report    end. Waits for the shards, downloads their reports and the scanner working
  #                   directory, and uploads the analysis. This is the only part a pull request
  #                   waits for that it was not already waiting for.
  #
  # Splitting begin from end is what buys the wall clock: end reads .sonarqube/out (the protobuf
  # the analyzers wrote during the build) and the sources, never the binaries, so the build does
  # not have to sit behind the shards. The working directory travels as one tar rather than as an
  # artifact tree, because .sonarqube/resources is thousands of small files and because tar does
  # not care that the directory name starts with a dot.
  #
  # The reason lot 2 left this alone was that a scanner which cannot line a coverage report up
  # with the sources it analysed drops the report and publishes a smaller number instead of
  # failing. Two things hold that shut, both in sonar-report and both before end runs:
  #
  #   - .github/scripts/check-coverage-reports.py reads every downloaded report, fails when one
  #     carries no sequence point under this checkout (the unresolvable case), and fails when the
  #     union lands under the floor (the missing-report case). Paths line up because every runner
  #     in a repository checks out at the same absolute path, which is also what the check
  #     asserts rather than assumes.
  #   - the ProjectInfo count fails the job if the tar arrived without the build output, which is
  #     the way this split could otherwise publish an empty, green analysis.
  #
  # Two things the move gives up, both on purpose. A red shard now skips sonar-report through
  # needs, so a pull request with failing E2E gets no quality gate until it is fixed, and a red
  # shard on main costs the baseline analysis every pull request's new-code comparison is
  # measured against, which is the more expensive half: the alternative is analysing whatever
  # coverage a half-finished shard left behind, which is the silent lowering again. And a pull
  # request that targets neither main nor feat/** no longer gets an analysis, because it no
  # longer gets a CI run either.
  #
  # What no local run could settle, and what the first CI run has to: the wall clock of the two
  # jobs, and what the collector costs a shard. Read both off the run and correct the numbers
  # above.
  sonar-analysis:
    name: SonarCloud scanner (begin, build, pure coverage)
    # Two cases where SONAR_TOKEN is not there to be had, and the scanner cannot authenticate
    # without it. Both are skipped here and picked up by the post-merge push run on main.
    #  - Fork PRs run without repository secrets.
    #  - Dependabot PRs get the dependabot secret store, not the repository one, so the token
    #    is empty even though the branch lives in this repository and clears the fork check.
    # Both tests sit inside the pull_request branch on purpose. The push run on main is the
    # fallback this job leans on, so nothing here may be able to skip it.
    if: >-
      github.event_name != 'pull_request'
      || (github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history in both sonar jobs: end wants it for blame and new-code, and begin
          # records the SCM setup the same run then uses.
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Vintage Story server
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ env.VS_VERSION }}

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-cache-${{ runner.os }}

      - name: Cache dotnet-sonarscanner tool
        id: cache-sonarscanner
        uses: actions/cache@v6
        with:
          path: ~/.dotnet/tools
          key: sonarscanner-${{ runner.os }}

      - name: Install dotnet-sonarscanner
        if: steps.cache-sonarscanner.outputs.cache-hit != 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # reportsPaths is a begin-time property (end takes nothing but the token), but it is
      # resolved at end, in the other job's workspace, where every report has been downloaded.
      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet-sonarscanner begin
          /k:"Pixnop_Atlas"
          /o:"leon-fievet-pixnop"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.coverage.exclusions="samples/**,tests/**"
          /d:sonar.exclusions="docs/**,.github/**"

      - name: Build
        run: dotnet build Atlas.slnx -c Release

      - name: Pure tests with coverage
        run: |
          dotnet test tests/Atlas.Pure.Tests \
            -c Release \
            --no-build \
            --filter "Category!=E2E" \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --results-directory TestResults

      - name: Pack the scanner working directory
        run: tar -cf sonarqube-workdir.tar .sonarqube

      - name: Upload the scanner working directory
        uses: actions/upload-artifact@v7
        with:
          name: sonarqube-workdir
          path: sonarqube-workdir.tar
          retention-days: 1

      - name: Upload pure coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-opencover-pure
          path: TestResults/*/coverage.opencover.xml
          if-no-files-found: error
          retention-days: 1

  sonar-report:
    name: SonarCloud quality gate
    # No fork or dependabot test of its own: sonar-analysis carries it, and a job whose
    # dependency was skipped is skipped too.
    needs: [sonar-analysis, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # No Vintage Story install and no build here: end analyses what begin's build already
      # wrote, which is why this job is short enough to sit at the end of the run.
      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-cache-${{ runner.os }}

      - name: Cache dotnet-sonarscanner tool
        id: cache-sonarscanner
        uses: actions/cache@v6
        with:
          path: ~/.dotnet/tools
          key: sonarscanner-${{ runner.os }}

      - name: Install dotnet-sonarscanner
        if: steps.cache-sonarscanner.outputs.cache-hit != 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Download the scanner working directory
        uses: actions/download-artifact@v7
        with:
          name: sonarqube-workdir

      - name: Unpack the scanner working directory
        run: tar -xf sonarqube-workdir.tar

      # Each artifact lands in its own directory under coverage/, so the reports keep the
      # collector's filename without colliding.
      - name: Download coverage reports
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-opencover-*
          path: coverage

      # download-artifact in pattern mode does not fail when it matches fewer artifacts than
      # it should, the way the name mode above does. The floor below would not catch a missing
      # one either: the two game versions cover the same lines, so losing one leg of a shard
      # pair costs no coverage at all. Six matrix legs plus the pure job is seven. This also
      # goes red the day the matrix grows a leg and nobody updates the consumer.
      - name: Check every coverage artifact arrived
        run: |
          count=$(find coverage -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "$count coverage artifact(s) downloaded"
          [ "$count" -eq 7 ]

      - name: Check the coverage reports the scanner will import
        run: |
          python3 .github/scripts/check-coverage-reports.py --self-check
          python3 .github/scripts/check-coverage-reports.py \
            --root "$GITHUB_WORKSPACE" \
            --min 85 \
            'coverage/**/coverage.opencover.xml'

      - name: Check the build output the scanner will analyse
        run: |
          count=$(find .sonarqube/out -name ProjectInfo.xml | wc -l)
          echo "$count project(s) in the scanner working directory"
          [ "$count" -gt 0 ]

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
