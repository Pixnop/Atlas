name: release

# Triggered on push of a version tag (v*): build, run the pure test suite, pack the four
# NuGet packages, publish them to nuget.org, and create a GitHub Release with the nupkgs
# attached and notes drawn from the CHANGELOG.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # OIDC token for nuget.org trusted publishing

env:
  VS_VERSION: "1.22.2"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Vintage Story server
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ env.VS_VERSION }}

      - name: Build
        run: dotnet build Atlas.slnx -c Release

      - name: Pure tests
        run: |
          dotnet test tests/Atlas.Pure.Tests \
            -c Release \
            --filter "Category!=E2E" \
            --logger "trx;LogFileName=pure-tests.trx" \
            --results-directory TestResults

      - name: Resolve version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing version $VERSION"

      - name: Pack
        run: |
          set -e
          # Version, not PackageVersion: it drives the package version AND the assembly,
          # file and informational versions the dlls report (see Directory.Build.props).
          dotnet pack Atlas.slnx -c Release -p:Version="$VERSION" -o artifacts
          ls -la artifacts

      # Trusted publishing: exchanges the GitHub OIDC token for a short-lived NuGet API key.
      # Requires the nuget.org trusted publishing policy (owner Pixnop, repo Pixnop/Atlas,
      # workflow release.yml); no stored secret involved.
      # The one third-party action on the publish path is pinned to a commit, not a tag: a
      # moved tag here would hand the OIDC exchange to code nobody reviewed. GitHub-owned
      # actions stay on major tags, the policy used by every other workflow in this repo.
      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Pixnop

      - name: Push to NuGet
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Extract changelog section
        run: |
          set -e
          awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        run: |
          # A tag with a suffix (v0.12.0-rc.1) is a pre-release on GitHub, like it is on NuGet.
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*.nupkg \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
